<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Brown Gradient -->
    <linearGradient id="db-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2511" />
      <stop offset="100%" stop-color="#2A1208" />
    </linearGradient>

    <!-- Warm Medium-Dark Brown Gradient -->
    <linearGradient id="db-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A3B1E" />
      <stop offset="100%" stop-color="#3D1E0B" />
    </linearGradient>

    <!-- Rich Amber-Brown Accent Gradient -->
    <linearGradient id="db-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5027" />
      <stop offset="100%" stop-color="#4A2511" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7A1E" />
    </linearGradient>

    <!-- Spine Highlight Gradient -->
    <linearGradient id="spine-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="logo-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#120703" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#logo-shadow)">
    <!-- Circular Emblem Background (Optional Container) -->
    <circle cx="250" cy="250" r="200" fill="#1A0B05" />
    <circle cx="250" cy="250" r="192" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.4" />

    <!-- Group: Book Spines (Side Profiles) -->
    <g transform="translate(0, 0)">
      
      <!-- BOOK 1: Leftmost (Slightly shorter, medium dark brown) -->
      <g id="book-1">
        <!-- Main Spine Body -->
        <rect x="135" y="160" width="48" height="200" rx="6" fill="url(#db-grad2)" />
        <!-- Page Block Side Profile (Right side) -->
        <rect x="177" y="166" width="6" height="188" rx="1" fill="#D9C5B2" opacity="0.7" />
        <!-- Spine 3D Texture Overlay -->
        <rect x="135" y="160" width="48" height="200" rx="6" fill="url(#spine-highlight)" />
        
        <!-- Decorative Bands (Horizontal Ribs) -->
        <line x1="135" y1="185" x2="183" y2="185" stroke="#2A1208" stroke-width="3" />
        <line x1="135" y1="188" x2="183" y2="188" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.8" />
        
        <line x1="135" y1="332" x2="183" y2="332" stroke="#2A1208" stroke-width="3" />
        <line x1="135" y1="335" x2="183" y2="335" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.8" />

        <!-- Minimalist Spine Detail / Icon -->
        <circle cx="159" cy="225" r="4" fill="url(#gold-grad)" opacity="0.7" />
        <rect x="156" y="245" width="6" height="45" rx="3" fill="#2A1208" opacity="0.5" />
      </g>

      <!-- BOOK 2: Center/Tallest (Deepest dark brown, gold accent) -->
      <g id="book-2">
        <!-- Main Spine Body -->
        <rect x="195" y="115" width="58" height="265" rx="7" fill="url(#db-grad1)" />
        <!-- Page Block Side Profile -->
        <rect x="247" y="122" width="6" height="251" rx="1" fill="#E8D8C8" opacity="0.85" />
        <!-- Spine 3D Texture Overlay -->
        <rect x="195" y="115" width="58" height="265" rx="7" fill="url(#spine-highlight)" />

        <!-- Raised Spine Ribs -->
        <rect x="193" y="150" width="60" height="5" rx="2" fill="#120703" />
        <rect x="195" y="151" width="56" height="2" fill="url(#gold-grad)" opacity="0.9" />

        <rect x="193" y="340" width="60" height="5" rx="2" fill="#120703" />
        <rect x="195" y="341" width="56" height="2" fill="url(#gold-grad)" opacity="0.9" />

        <!-- Elegant Gold Geometric Logo Mark on Spine -->
        <g transform="translate(224, 220)">
          <path d="M 0,-18 L 12,0 L 0,18 L -12,0 Z" fill="none" stroke="url(#gold-grad)" stroke-width="2" />
          <circle cx="0" cy="0" r="4" fill="url(#gold-grad)" />
        </g>
        
        <!-- Spine Title Accent Lines -->
        <rect x="212" y="255" width="24" height="3" rx="1.5" fill="url(#gold-grad)" opacity="0.8" />
        <rect x="217" y="265" width="14" height="2" rx="1" fill="url(#gold-grad)" opacity="0.5" />
      </g>

      <!-- BOOK 3: Right Side (Leaning slightly outward, rich amber-brown) -->
      <g id="book-3" transform="translate(265, 140) rotate(7) translate(-265, -140)">
        <!-- Main Spine Body -->
        <rect x="265" y="140" width="52" height="230" rx="6" fill="url(#db-grad3)" />
        <!-- Page Block Side Profile -->
        <rect x="311" y="146" width="6" height="218" rx="1" fill="#D9C5B2" opacity="0.75" />
        <!-- Spine 3D Texture Overlay -->
        <rect x="265" y="140" width="52" height="230" rx="6" fill="url(#spine-highlight)" />

        <!-- Spine Ribs -->
        <line x1="265" y1="170" x2="313" y2="170" stroke="#2A1208" stroke-width="3" />
        <line x1="265" y1="330" x2="313" y2="330" stroke="#2A1208" stroke-width="3" />

        <!-- Accent Gold Line Detail -->
        <line x1="291" y1="195" x2="291" y2="295" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
      </g>

      <!-- BOOK 4: Far Right Background Book (Thin, subtle overlap) -->
      <g id="book-4" transform="translate(322, 175) rotate(12) translate(-322, -175)">
        <rect x="322" y="175" width="38" height="195" rx="5" fill="url(#db-grad1)" />
        <rect x="355" y="180" width="5" height="185" rx="1" fill="#C5B09B" opacity="0.5" />
        <rect x="322" y="175" width="38" height="195" rx="5" fill="url(#spine-highlight)" />
        <!-- Simple Horizontal Accent -->
        <rect x="330" y="210" width="22" height="2" rx="1" fill="url(#gold-grad)" opacity="0.6" />
      </g>

    </g>

    <!-- Base / Shelf Line Accent -->
    <path d="M 100 380 L 400 380" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 140 386 L 360 386" stroke="#4A2511" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
